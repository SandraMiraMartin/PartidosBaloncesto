<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  
  <script src="script.js"></script>
  <!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">-->
  <title>Partidos</title>
</head>
<body>

  <!-- Contenedor Centrado -->
  <div class="div-padre">
    <div class="div-hijo">
      <h1>Gestionar Partidos</h1>

      <button id="btnAbrirModal" class="mi-boton-personalizado">
        + Añadir Jugadores / Jugadoras
      </button>

      <p class="contador">Jugadores añadidos: <span id="contadorJugadores">0</span> / 12</p>

      <!-- Lista de Jugadores -->
      <ul id="listaJugadores" class="lista-jugadores"></ul>
    </div>
  </div>

  <!-- Modal / Ventana Emergente Personalizada -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-contenido">
      <div class="modal-header">
        <h2>Añadir Jugador/a</h2>
        <button id="btnCerrarModal" class="btn-cerrar">&times;</button>
      </div>
      
      <form id="formJugador">
        <div class="campo-grupo">
          <label for="numeroJugador">Número / Dorsal</label>
          <input type="number" id="numeroJugador" min="1" max="99" required placeholder="Ej. 10">
        </div>
        
        <div class="campo-grupo">
          <label for="nombreJugador">Nombre del Jugador/a</label>
          <input type="text" id="nombreJugador" required placeholder="Ej. Alex Morgan">
        </div>

        <button type="submit" class="btn-guardar">Guardar Jugador/a</button>
      </form>
    </div>
  </div>

</body>
</html>
